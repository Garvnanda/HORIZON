# Pings the Render backend so the free instance doesn't spin down (15 min idle).
# Set repo variable BACKEND_URL = https://<your-app>.onrender.com
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.BACKEND_URL }}/api/health"
